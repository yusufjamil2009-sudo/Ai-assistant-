name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Create temporary CI signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ustad-ci-release.jks" \
            -storepass ustad-ci-store \
            -keypass ustad-ci-key \
            -alias ustad-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 7 \
            -dname "CN=USTAD CI, OU=Build, O=USTAD, L=CI, ST=CI, C=IN"
      - name: Build debug APK
        run: gradle clean :app:assembleDebug --stacktrace
      - name: Build signed release APK
        env:
          CI_KEYSTORE_FILE: ${{ runner.temp }}/ustad-ci-release.jks
          CI_KEYSTORE_PASSWORD: ustad-ci-store
          CI_KEY_ALIAS: ustad-ci
          CI_KEY_PASSWORD: ustad-ci-key
        run: gradle :app:assembleRelease --stacktrace
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: ustad-personal-ai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ustad-personal-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
